<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Pagina non trovata | Wild Table Cilento</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Figtree:wght@400;500;600&display=swap">
<style>
  :root { --mare: #1e2d4a; --sabbia: #f4efe6; --terracotta-chiaro: #eaa98a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--mare); color: var(--sabbia);
    font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    padding: 48px max(24px, calc((100% - 720px) / 2));
  }
  .logo { font-family: 'Newsreader', Georgia, serif; font-size: 1.25rem; margin-bottom: 48px; color: rgba(244,239,230,0.85); text-decoration: none; }
  .logo em { color: var(--terracotta-chiaro); }
  h1 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: clamp(2.6rem, 7vw, 4.4rem); line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 24px; text-wrap: balance; }
  h1 em { color: var(--terracotta-chiaro); font-style: italic; }
  p { font-size: 1.12rem; line-height: 1.7; color: rgba(244,239,230,0.8); max-width: 52ch; margin-bottom: 40px; }
  .btn { align-self: flex-start; background: var(--sabbia); color: #4a5c3a; padding: 14px 26px; font-weight: 600; text-decoration: none; border-radius: 2px; transition: background-color 0.2s; }
  .btn:hover { background: white; }
  .btn:focus-visible { outline: 3px solid var(--terracotta-chiaro); outline-offset: 3px; }
</style>
</head>
<body>
  <a class="logo" href="/">Wild <em>Table</em> Cilento</a>
  <h1>Pagina <em>non trovata.</em></h1>
  <p>L’indirizzo che hai aperto non esiste o è stato spostato. Dalla home trovi programma, pacchetti e il modulo per partecipare.</p>
  <a class="btn" href="/">← Torna alla home</a>
</body>
</html>
